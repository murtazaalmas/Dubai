<!-- Loader Overlay -->
<div class="loader-overlay" *ngIf="isLoading">

    <img src="/assets/images/loading_5.svg" alt="Daas" class="loader-logo">
  </div>
</div>

<!-- Main Content -->
<div class="main-content" [class.hidden]="isLoading">
  <app-message-popup />
  <router-outlet></router-outlet>
</div>
