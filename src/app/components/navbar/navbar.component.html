<!-- Top Yellow Bar -->
<div class="top-bar">
  <div class="row">
    <div class="col-md-4">
      <p class="date-time">{{ currentDate | date:'d MMM yyyy HH:mm' }}</p>
    </div>
    <div class="col-md-8">
      <div class="top-links desktop-only">
        <ng-container *ngFor="let link of topBarLinks; let last = last">
          <a *ngIf="link.route"
             class="hover-underline top-link-item"
             [href]="link.route"
             [attr.target]="link.route.startsWith('http') ? '_blank' : null">
            <ng-container *ngIf="link.icon">
              <i [class]="link.icon"></i>
            </ng-container>
            {{ link.label }}
          </a>
          <span *ngIf="!link.route" class="hover-underline top-link-item">
            <ng-container *ngIf="link.icon">
              <i [class]="link.icon"></i>
            </ng-container>
            {{ link.label }}
          </span>
          <span class="separator" *ngIf="!last">|</span>
        </ng-container>
        <!-- Cart Icon (top right, with top-links) -->
        <button class="cart-icon-btn" (click)="toggleCartDrawer()" aria-label="Open cart">
          <i class="fas fa-shopping-cart"></i>
          <span class="cart-badge" *ngIf="cartCount > 0">
            {{ cartCount }}
          </span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Main Navbar -->
<header class="main-nav">
  <!-- Logo -->
  <div class="logo-container">
    <img [routerLink]="['/']" src="/assets/images/logo.png" alt="Ijaz Bikes" class="navLogo">
  </div>

  <!-- Hamburger for mobile -->
  <button class="hamburger" (click)="toggleMobileMenu()" aria-label="Toggle navigation">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <!-- Menu Items -->
  <nav class="nav-menu" [class.open]="showMobileMenu">
    <!-- X close button for mobile -->
    <button class="close-drawer mobile-only" (click)="toggleMobileMenu()" aria-label="Close menu">
      <i class="fas fa-times"></i>
    </button>
    <!-- Top links for mobile -->

    <!-- End top links for mobile -->
    <div class="nav-item " *ngFor="let item of navMenu; let i = index">
      <a class="nav-link "
         role="button"
         [routerLink]="item.route ? item.route : null"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }"
         (click)="showMobileMenu ? toggleMenu(i) : null">
        <i [class]="item.icon"></i>
        {{ item.name }}
      </a>
      
    </div>
    <hr>

    <div class="top-links mobile-only">
      <ng-container *ngFor="let link of topBarLinks; let last = last">
        <a *ngIf="link.route"
           class="hover-underline top-link-item"
           [href]="link.route"
           [attr.target]="link.route.startsWith('http') ? '_blank' : null">
          <ng-container *ngIf="link.icon">
            <i [class]="link.icon"></i>
          </ng-container>
          {{ link.label }}
        </a>
        <span *ngIf="!link.route" class="hover-underline top-link-item">
          <ng-container *ngIf="link.icon">
            <i [class]="link.icon"></i>
          </ng-container>
          {{ link.label }}
        </span>
        <!-- <span class="separator" *ngIf="!last">|</span> -->
      </ng-container>
    </div>
  </nav>

  <!-- Overlay for mobile menu -->
  <div class="mobile-menu-overlay" *ngIf="showMobileMenu" (click)="toggleMobileMenu()"></div>
</header>

<!-- Cart Drawer Overlay and Drawer -->
<div class="cart-drawer-overlay" *ngIf="showCartDrawer" (click)="toggleCartDrawer()"></div>
<div class="cart-drawer" *ngIf="showCartDrawer">
  <button class="close-cart-drawer" (click)="toggleCartDrawer()" aria-label="Close cart">
    <i class="fas fa-times"></i>
  </button>
  <div class="cart-drawer-content">
    <h2>Your Cart</h2>
    <ng-container *ngIf="cartItems && cartItems.length > 0; else emptyCart">
      <div class="cart-item" *ngFor="let cart of cartItems; let i = index">
        <img [src]="cart.item.image" [alt]="cart.item.name" class="cart-item-image">
        <div class="cart-item-info">
          <div class="cart-item-name">{{ cart.item.name }}</div>
          <div class="cart-item-price">{{ cart.item.price }}</div>
          <div class="cart-item-qty">Qty: {{ cart.quantity }}</div>
        </div>
        <button class="cart-item-delete" (click)="removeCartItem(i)" aria-label="Remove item">
          <i class="fas fa-trash"></i>
        </button>
      </div>
    </ng-container>
    <ng-template #emptyCart>
      <p>Your cart is empty.</p>
    </ng-template>
  </div>
</div>
