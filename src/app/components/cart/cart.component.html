<app-navbar [disableCartDrawer]="true" [showCartIcon]="false"></app-navbar>
<h1 class="cart-page-title">Your Cart</h1>
<div *ngIf="cartItems.length === 0" class="cart-empty">Your cart is empty.</div>
<div *ngIf="cartItems.length > 0">
  <div class="cart-list">
    <div class="cart-item" *ngFor="let cart of cartItems; let i = index">
      <img [src]="cart.item.image" [alt]="cart.item.name" class="cart-item-image">
      <div class="cart-item-info">
        <div class="cart-item-name">{{ cart.item.name }}</div>
        <div class="cart-item-price">Rs {{ cart.item.price | number:'1.0-0' }}</div>
        <div class="cart-item-qty">
          <span>Qty:</span>
          <button class="qty-btn" (click)="decrementCartQty(i)">-</button>
          <input #qtyInput type="number" min="1" [value]="cart.quantity" (change)="onCartQtyInput(i, qtyInput.value)" />
          <button class="qty-btn" (click)="incrementCartQty(i)">+</button>
        </div>
      </div>
      <button class="cart-item-delete" (click)="removeCartItem(i)" aria-label="Remove item">
        <i class="fas fa-trash"></i>
      </button>
    </div>
  </div>
  <div class="cart-order-note">
    <label for="orderNote">Add Order Note</label>
    <textarea id="orderNote" [(ngModel)]="orderNote" rows="3" placeholder="Add a note to your order..."></textarea>
  </div>
  <div class="cart-summary">
    <div class="cart-summary-row">
      <span>Subtotal</span>
      <span>{{ getSubtotal() | currency:'PKR':'symbol':'1.0-0' }}</span>
    </div>
    <div class="cart-summary-row">
      <span>Shipping</span>
      <span>{{ shipping | currency:'PKR':'symbol':'1.0-0' }}</span>
    </div>
    <div class="cart-summary-row cart-summary-total">
      <span>Total</span>
      <span>{{ getTotal() | currency:'PKR':'symbol':'1.0-0' }}</span>
    </div>
    <button class="cart-checkout-btn" [routerLink]="['/checkout']">Checkout</button>
  </div>
</div>
