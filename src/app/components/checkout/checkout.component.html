<div class="checkout-container">
  <div class="checkout-main">
    <div class="checkout-cart-summary">
      <h2>Your Cart</h2>
      <div *ngIf="cartItems.length === 0" class="cart-empty">Your cart is empty.</div>
      <div *ngIf="cartItems.length > 0">
        <div class="cart-list">
          <div class="cart-item" *ngFor="let cart of cartItems">
            <div class="cart-item-image-wrapper">
              <img [src]="cart.item.image" [alt]="cart.item.name" class="cart-item-image">
              <span class="cart-item-qty-badge">{{ cart.quantity }}</span>
            </div>
            <div class="cart-item-info">
              <div class="cart-item-name">{{ cart.item.name }}</div>
              <div class="cart-item-price">Rs {{ cart.item.price | number:'1.0-0' }}</div>
            </div>
          </div>
        </div>
        <div class="cart-summary">
          <div class="cart-summary-row">
            <span>Subtotal</span>
            <span>Rs {{ getSubtotal() | number:'1.0-0' }}</span>
          </div>
          <div class="cart-summary-row">
            <span>Shipping</span>
            <span>Rs {{ shipping | number:'1.0-0' }}</span>
          </div>
          <div class="cart-summary-row cart-summary-total">
            <span>Total</span>
            <span>Rs {{ getTotal() | number:'1.0-0' }}</span>
          </div>
        </div>
      </div>
    </div>
    <form class="checkout-form">
      <h2>Contact</h2>
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" required />
      </div>
      <h2>Delivery</h2>
      <div class="form-row">
        <div class="form-group">
          <label for="country">Country</label>
          <input id="country" type="text" name="country" required />
        </div>
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input id="firstName" type="text" name="firstName" required />
        </div>
        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input id="lastName" type="text" name="lastName" required />
        </div>
      </div>
      <div class="form-group">
        <label for="address">Address</label>
        <input id="address" type="text" name="address" required />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="city">City</label>
          <input id="city" type="text" name="city" required />
        </div>
        <div class="form-group">
          <label for="postalCode">Postal Code</label>
          <input id="postalCode" type="text" name="postalCode" required />
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input id="phone" type="tel" name="phone" required />
        </div>
      </div>
      <h2>Shipping Method</h2>
      <div class="form-group">
        <label><input type="radio" name="shipping" checked /> Standard Shipping (PKR 500)</label>
      </div>
      <h2>Payment</h2>
      <div class="form-group">
        <label><input type="radio" name="payment" checked /> Cash on Delivery</label>
      </div>
      <button type="submit" class="checkout-submit-btn">Complete Order</button>
    </form>
   
  </div>
</div>
