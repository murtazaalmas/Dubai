<app-navbar [cartItems]="cartItems"></app-navbar>

<div class="home-container">
  <!-- AUTO SLIDER SECTION -->
  <section class="auto-slider-section">
    <div class="slider-container">
      <div class="slider-wrapper" [style.transform]="'translateX(-' + (currentSlide * 33.333) + '%)'">
        <div class="slide" *ngFor="let slide of sliderImages; let i = index">
          <div class="slide-content-section">
            <div class="slide-content">
              <h2>{{slide.title}}</h2>
              <p>{{slide.description}}</p>
              <button class="shop-now-btn">Shop Now</button>
            </div>
          </div>
          <div class="slide-image-section">
            <img [src]="slide.image1" [alt]="slide.title" class="slide-image">
          </div>
          <div class="slide-image-section">
            <img [src]="slide.image2" [alt]="slide.title" class="slide-image">
          </div>
        </div>
      </div>

      <!-- Slider Navigation Dots -->
      <div class="slider-dots">
        <span *ngFor="let slide of sliderImages; let i = index" class="dot" [class.active]="i === currentSlide"
          (click)="goToSlide(i)">
        </span>
      </div>

      <!-- Slider Navigation Arrows -->
      <button class="slider-arrow prev" (click)="previousSlide()">
        <i class="fas fa-chevron-left"></i>
      </button>
      <button class="slider-arrow next" (click)="nextSlide()">
        <i class="fas fa-chevron-right"></i>
      </button>
    </div>
  </section>

  <!-- PRODUCT CARDS SLIDER -->
  <section class="product-cards-section">
    <h2>Featured Products</h2>
    <div class="product-slider-container">
      <div class="product-cards-slider" [style.transform]="getProductTransform()">
        <div class="product-card" *ngFor="let product of productCards" (click)="openPopup(product)">
          <div class="product-image">
            <img [src]="product.image" [alt]="product.name" loading="lazy">
          </div>
          <div class="product-content">
            <h3>{{product.name}}</h3>
            <p class="price">${{product.price.toFixed(2)}}</p>
            <button class="add-to-cart-btn" (click)="$event.stopPropagation(); addToCart(product)">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Product Slider Navigation Arrows -->
      <button class="product-slider-arrow prev" (click)="previousProductSlide()">
        <i class="fas fa-chevron-left"></i>
      </button>
      <button class="product-slider-arrow next" (click)="nextProductSlide()">
        <i class="fas fa-chevron-right"></i>
      </button>
      
      <!-- Product Slider Navigation Dots -->
      <div class="product-slider-dots">
        <span *ngFor="let _ of [].constructor(totalProductSlides); let i = index" 
              class="dot" 
              [class.active]="i === currentProductSlide"
              (click)="goToProductSlide(i)">
        </span>
      </div>
    </div>
  </section>

</div>

<!-- Popup Component -->
<app-popup 
  *ngIf="showPopup" 
  [category]="selectedProduct" 
  (close)="closePopup()" 
  (addCartItem)="onAddCartItem($event)">
</app-popup>

<app-footer></app-footer>
