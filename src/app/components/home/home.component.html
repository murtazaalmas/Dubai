<app-navbar></app-navbar>

<div class="slider-container">
  <button class="arrow left" (click)="prevSlide()">&#10094;</button>
  <div class="slides" [style.transform]="'translateX(-' + currentIndex * 100 + '%)'">
    <div *ngFor="let slide of slides" class="slide">
      <div class="column content sports-container">
        <div class="sports-content">
          <!-- Heading -->
          <h1 class="sports-heading reveal" [innerHTML]="slide.heading"></h1>

          <!-- Subtext -->
          <p class="sports-subtext">{{ slide.subtext }}</p>

          <!-- Buttons -->
          <div class="sports-buttons">
            <button *ngFor="let button of slide.buttons">{{ button }}</button>
          </div>
        </div>
      </div>
      <div class="images-container">
        <div class="column image">
          <img [src]="slide.image1" alt="Slide Image 1">
        </div>
        <div class="column image">
          <img [src]="slide.image2" alt="Slide Image 2">
        </div>
      </div>
    </div>
  </div>
  <button class="arrow right" (click)="nextSlide()">&#10095;</button>
</div>

<!-- Product Slider -->
<div class="product-slider-container">
  <h2>Our Products</h2>
  <div class="product-slider">
    <button class="arrow left" (click)="prevProduct()">&#10094;</button>
    <div class="product-slides-wrapper">
      <div class="product-slides" [style.transform]="productSliderTransform">
        <div *ngFor="let product of products" class="product-slide" [style.flex-basis.%]="slideWidth" (click)="openPopup(product)">
          <img [src]="product.image" [alt]="product.name">
          <p>{{ product.name }}</p>
        </div>
      </div>
    </div>
    <button class="arrow right" (click)="nextProduct()">&#10095;</button>
  </div>
  <div class="dots-container">
    <span *ngFor="let i of [].constructor(totalProductSlides); let idx = index" 
          class="dot" 
          [class.active]="productCurrentIndex === idx" 
          (click)="goToProductSlide(idx)"></span>
  </div>
</div>

<app-footer></app-footer>

<app-popup 
    *ngIf="showPopup" 
    [category]="selectedProduct" 
    (close)="closePopup()"
    (addCartItem)="addToCart($event)">
</app-popup>
